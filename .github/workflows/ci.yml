name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the run in flight. The Docker job
# takes several minutes; queueing them behind each other wastes runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  python:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # CPU-only torch. The default wheels pull ~2.5GB of CUDA that no runner
      # here can use, and it dominates install time.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check src scripts eval test api

      - name: Format check
        run: ruff format --check src scripts eval test api

      - name: Type check
        run: mypy src eval api

      # No test calls a real provider: clients are stubbed and the retry
      # policy's sleeps are patched, so this needs no API keys and no network.
      - name: Tests
        run: pytest test --cov --cov-report=term --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

      # The API serves this path; a build that lands somewhere else would only
      # be noticed in production.
      - name: Verify the bundle landed where the API serves it
        run: test -f static/index.html && test -d static/assets

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    # Only after the cheap checks pass. This job downloads torch, an embedding
    # model, and 28MB of papers; running it against code that fails lint is
    # several wasted minutes.
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Not pushed anywhere. The point is that the image *builds* -- which
      # includes fetching all eight papers and indexing them, so a broken
      # download URL or a chunking regression fails here rather than on deploy.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: researchgpt:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the container and check health
        run: |
          docker run -d --name rg -p 7860:7860 \
            -e LLM_PROVIDER=gemini -e GEMINI_API_KEY=not-a-real-key \
            researchgpt:ci

          # Startup loads the embedding model and builds a BM25 index over
          # every chunk; on a cold runner that is comfortably over a minute.
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:7860/health > /tmp/health.json; then
              break
            fi
            sleep 5
          done

          cat /tmp/health.json
          docker logs rg | tail -30

          # `degraded` would mean the corpus is empty, which means the build
          # produced an image that cannot answer anything.
          test "$(jq -r .status /tmp/health.json)" = "ok"
          test "$(jq -r .total_papers /tmp/health.json)" -eq 8

      - name: Check the UI is served
        run: |
          curl -fsS http://localhost:7860/ | grep -q 'id="root"'

      - name: Stop
        if: always()
        run: docker rm -f rg || true
